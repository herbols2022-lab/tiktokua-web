<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открыть в браузере</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            margin: 0; padding: 0; height: 100vh;
            background: linear-gradient(180deg, #2a0066, #4a148c);
            color: white; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; overflow: hidden; user-select: none;
        }
        .fingerprint {
            width: 180px; height: 180px; background: white; border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            margin: 30px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.4); cursor: pointer;
        }
        .fingerprint svg { width: 110px; height: 110px; fill: #e53935; }
        h1 { font-size: 26px; margin: 12px 0; line-height: 1.2; }
        p { font-size: 17px; max-width: 320px; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="fingerprint" id="print">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9v7c0 3.87 3.13 7 7 7s7-3.13 7-7V9c0-3.87-3.13-7-7-7z"/>
            <path d="M12 6c-1.66 0-3 1.34-3 3v4c0 1.66 1.34 3 3 3s3-1.34 3-3V9c0-1.66-1.34-3-3-3z" fill="#fff"/>
        </svg>
    </div>

    <h1>🔊 УДЕРЖИВАЙТЕ ПАЛЕЦ НА ОТПЕЧАТКЕ!</h1>
    <h1>🔊 PRESS AND HOLD YOUR FINGER ON THE PRINT</h1>
    
    <p>Выберите "Открыть ссылку(в браузере)".</p>
    <p>choose "open link".</p>

    <script>
        let holdTimer;
        const redirectUrl = "https://tone.affomelody.com/click?pid=37925&offer_id=25&sub1=Tiktok&l=1701424929&to=aHR0cHM6Ly90b25lLmFmZm9tZWxvZHkuY29tL2NsaWNrP3BpZD0zNzkyNSZvZmZlcl9pZD0yNQ==";

        const print = document.getElementById('print');

        function redirect() {
            window.location.href = redirectUrl;
        }

        function startHold(e) {
            e.preventDefault();
            holdTimer = setTimeout(redirect, 700); // чуть быстрее — 0.7 сек
        }

        function cancelHold() {
            clearTimeout(holdTimer);
        }

        // Основные события
        print.addEventListener('touchstart', startHold, { passive: false });
        print.addEventListener('touchend', cancelHold);
        print.addEventListener('touchcancel', cancelHold);

        print.addEventListener('mousedown', startHold);
        print.addEventListener('mouseup', cancelHold);
        print.addEventListener('mouseleave', cancelHold);

        // Клик по всей странице тоже работает (для удобства)
        document.body.addEventListener('click', redirect);
    </script>
</body>
</html>
