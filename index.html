<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    height:100vh;
    overflow:hidden;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;

    font-family:'Inter',sans-serif;
    color:white;

    background:
    radial-gradient(circle at top,#6d28d9 0%,#4c1d95 45%,#2e1065 100%);
}

/* Карточка */
.fingerprint-link{
    width:260px;
    height:260px;
    background:#f8f8f8;
    border-radius:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    box-shadow:
    0 25px 60px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.8);

    transition:.18s ease;
    margin-bottom:30px;
    position:relative;
}

.fingerprint-link:active{
    transform:scale(.93);
}

/* Красный круг */
.fingerprint-circle{
    width:175px;
    height:175px;
    border-radius:50%;

    background:linear-gradient(180deg,#ff4d67,#ef3b57);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 15px 40px rgba(239,59,87,.45),
    inset 0 3px 10px rgba(255,255,255,.25);

    animation:pulse 1.5s infinite;
}

/* SVG */
.fingerprint-svg{
    width:112px;
    height:112px;
}

.fingerprint-svg path{
    fill:none;
    stroke:white;
    stroke-width:2.3;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* Анимация */
@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

h1{
    margin:4px 0;
    font-size:25px;
    font-weight:700;
    line-height:1.15;
    text-shadow:0 4px 12px rgba(0,0,0,.25);
}

.big-btn{
    margin-top:24px;

    background:linear-gradient(180deg,#ff4d67,#ef3b57);

    color:white;
    text-decoration:none;

    padding:18px 42px;

    border-radius:999px;

    font-size:19px;
    font-weight:700;

    box-shadow:
    0 12px 35px rgba(239,59,87,.45);

    transition:.18s ease;
}

.big-btn:active{
    transform:scale(.96);
}

p{
    margin-top:24px;
    font-size:16px;
    opacity:.92;
    max-width:340px;
    line-height:1.45;
}
</style>
