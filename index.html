<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открыть в браузере</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            margin: 0; padding: 0; height: 100vh;
            background: linear-gradient(180deg, #2a0066, #4a148c);
            color: white; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; overflow: hidden;
        }
        .fingerprint {
            width: 220px; height: 220px; background: white; border-radius: 50px;
            display: flex; align-items: center; justify-content: center;
            margin: 20px 0; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            cursor: pointer; transition: all 0.2s;
        }
        .fingerprint:active { transform: scale(0.9); }
        .fingerprint svg { width: 130px; height: 130px; fill: #e53935; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        h1 { font-size: 26px; margin: 10px 0; line-height: 1.1; }
        .link-btn {
            margin-top: 30px; padding: 18px 40px; background: #e53935; color: white;
            border: none; border-radius: 50px; font-size: 19px; font-weight: 700;
            cursor: pointer; box-shadow: 0 10px 30px rgba(229,57,53,0.6);
            text-decoration: none; display: inline-block;
        }
        p { font-size: 16px; opacity: 0.9; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="fingerprint" id="print">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9v7c0 3.87 3.13 7 7 7s7-3.13 7-7V9c0-3.87-3.13-7-7-7z"/>
            <path d="M12 6c-1.66 0-3 1.34-3 3v4c0 1.66 1.34 3 3 3s3-1.34 3-3V9c0-1.66-1.34-3-3-3z" fill="#fff"/>
        </svg>
    </div>

    <h1>🔊 УДЕРЖИВАЙТЕ ПАЛЕЦ НА ОТПЕЧАТКЕ!</h1>
    <h1>🔊 PRESS AND HOLD YOUR FINGER ON THE PRINT</h1>

    <a href="https://tone.affomelody.com/click?pid=37925&offer_id=25&sub1=Tiktok&l=1701424929&to=aHR0cHM6Ly90b25lLmFmZm9tZWxvZHkuY29tL2NsaWNrP3BpZD0zNzkyNSZvZmZlcl9pZD0yNQ==" 
       target="_blank" 
       class="link-btn" 
       id="realLink">
        ПЕРЕЙТИ НА САЙТ ЗНАКОМСТВ
    </a>

    <p>После зажатия отпечатка —<br>зажми кнопку выше и выбери<br><strong>"Открыть в браузере"</strong></p>

    <script>
        const redirectUrl = "https://tone.affomelody.com/click?pid=37925&offer_id=25&sub1=Tiktok&l=1701424929&to=aHR0cHM6Ly90b25lLmFmZm9tZWxvZHkuY29tL2NsaWNrP3BpZD0zNzkyNSZvZmZlcl9pZD0yNQ==";

        let holdTimer;
        const print = document.getElementById('print');
        const realLink = document.getElementById('realLink');

        function goToLink() {
            realLink.style.display = 'inline-block';
            window.open(redirectUrl, '_system');
            setTimeout(() => window.location.href = redirectUrl, 200);
        }

        function startHold(e) {
            e.preventDefault();
            holdTimer = setTimeout(goToLink, 650);
        }

        function cancelHold() {
            clearTimeout(holdTimer);
        }

        print.addEventListener('touchstart', startHold, { passive: false });
        print.addEventListener('touchend', cancelHold);
        print.addEventListener('touchcancel', cancelHold);
        print.addEventListener('touchmove', cancelHold);

        print.addEventListener('mousedown', startHold);
        print.addEventListener('mouseup', cancelHold);
        print.addEventListener('mouseleave', cancelHold);

        document.body.addEventListener('click', goToLink);
    </script>
</body>
</html>
